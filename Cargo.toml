[workspace]
resolver = "3"
members = [
    "crates/wreq",
    "crates/wreq-util",
    "crates/btls/btls",
    "crates/btls/btls-sys",
    "crates/btls/tokio-btls",
    "crates/btls/tokio-btls/bench",
]
default-members = [
    "crates/wreq",
    "crates/wreq-util",
    "crates/btls/btls",
    "crates/btls/btls-sys",
    "crates/btls/tokio-btls",
]

[workspace.package]
version = "0.5.6"
repository = "https://github.com/0x676e67/btls"
edition = "2021"
rust-version = "1.85"

[workspace.metadata.release]
pre-release-commit-message = "Release {{version}}"
shared-version = true
tag-prefix = ""
publish = false

[workspace.dependencies]
btls-sys = { version = "0.5.6", path = "crates/btls/btls-sys" }
btls = { version = "0.5.6", path = "crates/btls/btls" }
tokio-btls = { version = "0.5.6", path = "crates/btls/tokio-btls" }

bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
bitflags = "2.11.1"
brotli = "9.0.0"
cmake = "0.1.58"
fs_extra = "1.3.0"
fslock = "0.2"
foreign-types = "0.5"
libc = "0.2.185"
hex = "0.4"
futures = "0.3"
tokio = "1.52.1"
openssl-macros = "0.1.1"

# Benchmarks only (tokio-btls/bench).
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
cpu-time = "1.0.0"
criterion = "0.8.2"
sysinfo = { version = "0.39.6", default-features = false }
tikv-jemallocator = { version = "0.7.0", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }

[profile.release]
codegen-units = 1
incremental = false

[profile.bench]
codegen-units = 1
incremental = false

[patch.crates-io]
wreq = { path = "crates/wreq" }
btls = { path = "crates/btls/btls" }
btls-sys = { path = "crates/btls/btls-sys" }
tokio-btls = { path = "crates/btls/tokio-btls" }
http2 = { git = "https://github.com/0x676e67/http2", rev = "3219d38910c22105ea7fc5464696f26589432e9c" }
netty = { git = "https://github.com/0x676e67/netty", rev = "314db585d85e7ea9c15535f458e7324b800fc702" }
