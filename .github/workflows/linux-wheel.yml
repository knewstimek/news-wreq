name: Linux Python wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-wheel.yml'
      - '.gitmodules'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'bindings/python/**'
      - 'crates/**'

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: '2_28'
          sccache: true
          command: build
          args: >-
            --locked --release --manifest-path bindings/python/Cargo.toml
            --interpreter /opt/python/cp311-cp311/bin/python --out dist
          before-script-linux: dnf install -y clang-devel

      - name: Verify the installed wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/wreq-wheel-test"
          source "$RUNNER_TEMP/wreq-wheel-test/bin/activate"
          python -m pip install dist/*.whl pytest pytest-asyncio
          python -m pytest -q bindings/python/tests/tls_test.py -k 'schannel_client_hello or local_emulation_profiles or trust_anchors'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wreq-manylinux-x86_64
          path: dist/*.whl
          if-no-files-found: error
